  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      line-height: 1.15;
    }

    body {
      background-color: #fadad8;
      color: #353848;
      min-height: 100dvh;
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI",
        Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      animation: 0.8s ease-out fadeIn;
    }

    main {
      width: 100%;
      max-width: 44rem;
      min-height: 16.5rem;
    }

    .wrapper {
      display: flex;
      flex-direction: row;
      height: 100%;
      border-radius: 1.125rem;
      overflow: hidden;
      box-shadow: 0 18px 40px -12px rgba(83, 72, 71, 0.22),
        0 4px 12px -2px rgba(83, 72, 71, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.4);
      animation: 0.9s cubic-bezier(0.22, 1, 0.36, 1) dropIn;
    }

    .profile {
      background: #f0e5de;
      color: #534847;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      flex: 0.85;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.75rem 1.25rem;
    }

    img {
      height: 6.75rem;
      width: 6.75rem;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(83, 72, 71, 0.15);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    img:hover {
      transform: scale(1.04);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0.85rem 0 0.35rem;
    }

    .status {
      font-size: 0.8125rem;
      font-weight: 500;
      opacity: 0.85;
      letter-spacing: 0.03em;
      text-align: center;
    }

    .portfolio {
      background-color: #d9d4cf;
      color: #635e5d;
      flex: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.75rem 2rem;
      gap: 1rem;
    }

    p {
      line-height: 1.95;
      margin: 0;
      padding: 0 0.5rem;
      font-size: 0.9375rem;
      letter-spacing: 0.01em;
      text-align: center;
      text-wrap: pretty;
    }

    #links {
      min-width: 6rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1.25rem;
      justify-content: center;
      padding-top: 0.5rem;
    }

    #links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem;
      border-radius: 0.5rem;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    footer {
      padding-top: 1.5rem;
      font-size: 0.875rem;
      animation: 0.9s cubic-bezier(0.22, 1, 0.36, 1) jumpIn;
    }

    svg {
      fill: #534847;
      height: 20px;
      width: 20px;
      opacity: 0.85;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }

    #links a:hover svg {
      transform: translateY(-2px) scale(1.15);
      opacity: 1;
    }

    .tag {
      background: #ef9e9f;
      color: #f8f8ff;
      padding: 0.15rem 0.4rem;
      border-radius: 0.3rem;
      font-size: 0.8125rem;
      font-weight: 500;
    }

    @media (max-width: 560px) {
      main {
        min-height: auto;
      }

      .wrapper {
        flex-direction: column;
      }

      .profile {
        flex: 1;
        padding: 1.5rem 1.25rem;
      }

      img {
        height: 6rem;
        width: 6rem;
      }

      .portfolio {
        flex: 1;
        padding: 1.5rem 1.25rem;
      }
    }

    @-webkit-keyframes dropIn {
      from {
        transform: translateY(-30px);
      }

      to {
        transform: translateY(0px);
      }
    }

    @keyframes dropIn {
      from {
        transform: translateY(-30px);
      }

      to {
        transform: translateY(0px);
      }
    }

    @-webkit-keyframes jumpIn {
      from {
        transform: translateY(30px);
      }

      to {
        transform: translateY(0px);
      }
    }

    @keyframes jumpIn {
      from {
        transform: translateY(30px);
      }

      to {
        transform: translateY(0px);
      }
    }

    @-webkit-keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #534847;
        color: #f0e5de;
      }

      .wrapper {
        box-shadow: 0 20px 44px -12px rgba(0, 0, 0, 0.45),
          0 0 20px rgba(255, 255, 243, 0.12);
        border-color: rgba(240, 229, 222, 0.18);
      }

      .profile {
        background: #9b8281;
        color: #f0e5de;
      }

      .portfolio {
        background-color: #d09e88;
        color: #f7efe9;
      }

      svg {
        fill: #534847;
      }

      .tag {
        background: #d09e88;
        color: #f8f8ff;
      }
    }
  </style>
</head>
